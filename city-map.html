};

const HAZARDS = {
  flood: {
    label: 'Flash flood', title: 'Flash flood impact', stamp: '16.04.2024 · S1A radar + drainage model',
    colors: { high: '#1F4E79', med: '#3E86B5', low: '#93BCD6' },
    legend: [['high', 'Over 50 cm'], ['med', '20–50 cm'], ['low', 'Under 20 cm']],
    metric: v => Math.round(18 + v * 0.62) + ' cm standing water',
    statUnits: [['Locations affected', 'sites'], ['Peak depth', 'cm'], ['People exposed', 'residents'], ['Road length', 'km']],
    summary: city => 'Radar water extent intersected with the street network across ' + city + '. Storm drainage is designed for a fraction of this rainfall, so depth concentrates in underpasses and low-lying industrial plots rather than spreading evenly.'
  },
  heat: {
    label: 'Heat & humidity', title: 'Heat stress impact', stamp: '28.07.2024 13:20 · LC09 thermal + wet-bulb',
    colors: { high: '#B31B1B', med: '#E04A16', low: '#F0A03C' },
    legend: [['high', 'Wet-bulb over 33 °C'], ['med', '30–33 °C'], ['low', 'Under 30 °C']],
    metric: v => (38 + v * 0.11).toFixed(1) + ' °C · WB ' + (29 + v * 0.05).toFixed(1) + ' °C',
    statUnits: [['Hot sites', 'over 42 °C'], ['Peak surface', '°C'], ['People exposed', 'residents'], ['Shaded area', '% of built']],
    summary: city => 'Surface temperature at the early-afternoon pass over ' + city + ', paired with wet-bulb from the nearest station. Outdoor work thresholds are exceeded at every high-severity site for more than six hours a day.'
  },
  dust: {
    label: 'Dust storm', title: 'Dust storm impact', stamp: '09.03.2024 · MODIS AOD + surface visibility',
    colors: { high: '#8A5A18', med: '#B98A3A', low: '#D9BE86' },
    legend: [['high', 'Visibility under 200 m'], ['med', '200–800 m'], ['low', 'Over 800 m']],
    metric: v => Math.round(1000 - v * 8.4) + ' m visibility · PM10 ' + Math.round(180 + v * 6.2),
    statUnits: [['Sites affected', 'sites'], ['Min visibility', 'm'], ['People exposed', 'residents'], ['Flights delayed', 'movements']],
    summary: city => 'Aerosol depth over ' + city + ' during the shamal event, calibrated against surface visibility readings. The worst corridors run perpendicular to the wind, where blown sand settles on the carriageway.'
  },
  coastal: {
    label: 'Coastal inundation', title: 'Coastal inundation exposure', stamp: 'Modelled · 50-yr surge at high tide',
    colors: { high: '#1D6F6A', med: '#3E9E95', low: '#8FC8C1' },
    legend: [['high', 'Over 1.5 m'], ['med', '0.8–1.5 m'], ['low', 'Under 0.8 m']],
    metric: v => (0.4 + v * 0.017).toFixed(1) + ' m above ground',
    statUnits: [['Exposed sites', 'sites'], ['Max inundation', 'm'], ['People exposed', 'residents'], ['Reclaimed land', '% of extent']],
    summary: city => 'Surge propagated onto the reclaimed shoreline of ' + city + ' for a 50-year return event at high tide. Exposure follows the newest waterfront development, which sits lowest above datum.'
  }
};

const SEV_ORDER = { high: 3, med: 2, low: 1 };
const SEV_LABEL = { high: 'High', med: 'Moderate', low: 'Low' };
const SEV_PATTERN = {
  flood:   ['high', 'high', 'med', 'med', 'low'],
  heat:    ['high', 'high', 'med', 'low', 'med'],
  dust:    ['med', 'high', 'high', 'low', 'med'],
  coastal: ['high', 'med', 'low', 'high', 'med']
};

function seeded(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 99991;
  return h % 100;
}

function featuresFor(cityKey, hazardKey) {
  const city = CITIES[cityKey];
  const hz = HAZARDS[hazardKey];
  const pat = SEV_PATTERN[hazardKey];
  return city.places.map((p, i) => {
    const sev = pat[i % pat.length];
    const base = sev === 'high' ? 62 : sev === 'med' ? 38 : 16;
    const v = base + (seeded(cityKey + hazardKey + p.name) % 22);
    return { name: p.name, area: p.area, kind: p.kind, coords: p.coords, sev: sev, metric: hz.metric(v), v: v };
  });
}

function statsFor(cityKey, hazardKey, feats) {
  const city = CITIES[cityKey];
  const hz = HAZARDS[hazardKey];
  const peak = feats.reduce((a, f) => Math.max(a, f.v), 0);
  const exposure = (city.pop * (0.06 + feats.filter(f => f.sev === 'high').length * 0.028)).toFixed(2);
  const fourth = {
    flood: (feats.length * 5.2 + (peak % 9)).toFixed(1),
    heat: 6 + (seeded(cityKey) % 9),
    dust: 18 + (seeded(cityKey + 'd') % 40),
    coastal: 22 + (seeded(cityKey + 'c') % 38)
  }[hazardKey];
  const peakDisplay = {
    flood: Math.round(18 + peak * 0.62),
    heat: (38 + peak * 0.11).toFixed(1),
    dust: Math.round(1000 - peak * 8.4),
    coastal: (0.4 + peak * 0.017).toFixed(1)
  }[hazardKey];
  return [
    [hz.statUnits[0][0], String(feats.length), hz.statUnits[0][1]],
    [hz.statUnits[1][0], String(peakDisplay), hz.statUnits[1][1]],
    [hz.statUnits[2][0], (exposure * 1000).toFixed(0) + 'k', hz.statUnits[2][1]],
    [hz.statUnits[3][0], String(fourth), hz.statUnits[3][1]]
  ];
}

let state = { city: 'dubai', hazard: 'flood', minSev: 'low', focus: null };

const map = L.map('map', { scrollWheelZoom: true, zoomControl: false })
  .setView(CITIES[state.city].center, CITIES[state.city].zoom);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
  attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors'
}).addTo(map);

const overlay = L.layerGroup().addTo(map);

function visibleFeatures() {
  return featuresFor(state.city, state.hazard)
    .filter(f => SEV_ORDER[f.sev] >= SEV_ORDER[state.minSev]);
}

function drawMap() {
  const h = HAZARDS[state.hazard];
  overlay.clearLayers();
  visibleFeatures().forEach(f => {
    const color = h.colors[f.sev];
    const isFocus = state.focus === f.name;
    let layer;
    if (f.kind === 'line') {
      layer = L.polyline(f.coords, {
        color: color, weight: f.sev === 'high' ? 9 : f.sev === 'med' ? 7 : 5,
        opacity: isFocus ? 1 : 0.82, lineCap: 'round'
      });
    } else if (f.kind === 'zone') {
      layer = L.polygon(f.coords, {
        color: color, weight: isFocus ? 3 : 1.5, fillColor: color,
        fillOpacity: isFocus ? 0.55 : 0.35
      });
    } else {
      layer = L.circleMarker(f.coords, {
        radius: isFocus ? 12 : 9, color: '#fff', weight: 2,
        fillColor: color, fillOpacity: 1
      });
    }
    layer.bindTooltip(f.name + ' — ' + f.metric, { direction: 'top', sticky: true });
    layer.on('click', () => { state.focus = f.name; render(); });
    layer.addTo(overlay);
  });
}

function el(tag, style, text) {
  const n = document.createElement(tag);
  if (style) n.setAttribute('style', style);
  if (text != null) n.textContent = text;
  return n;
}

function renderChrome() {
  const citySel = document.getElementById('city');
  if (!citySel.options.length) {
    Object.entries(CITIES).forEach(([k, v]) => {
      const o = document.createElement('option');
      o.value = k; o.textContent = v.label;
      o.selected = (k === state.city);
      citySel.appendChild(o);
    });
    citySel.value = state.city;
    citySel.addEventListener('change', e => {
      state.city = e.target.value; state.focus = null;
      const c = CITIES[state.city];
      map.setView(c.center, c.zoom);
      render();
    });
  }

  const hz = document.getElementById('hazards');
  hz.innerHTML = '';
  Object.entries(HAZARDS).forEach(([k, v]) => {
    const b = el('button', null, v.label);
    b.className = 'chip' + (state.hazard === k ? ' on' : '');
    b.addEventListener('click', () => { state.hazard = k; state.focus = null; render(); });
    hz.appendChild(b);
  });

  const sc = document.getElementById('sevChips');
  sc.innerHTML = '';
  ['low', 'med', 'high'].forEach(k => {
    const b = el('button', null, SEV_LABEL[k]);
    b.className = 'chip' + (state.minSev === k ? ' on' : '');
    b.addEventListener('click', () => { state.minSev = k; render(); });
    sc.appendChild(b);
  });
}

function render() {
  const h = HAZARDS[state.hazard];
  const cityLabel = CITIES[state.city].label.split(',')[0];
  renderChrome();

  document.getElementById('mapTitle').textContent = h.title;
  document.getElementById('mapStamp').textContent = h.stamp;
  document.getElementById('summary').textContent = h.summary(cityLabel);

  const lg = document.getElementById('legend');
  lg.innerHTML = '';
  h.legend.forEach(([sev, label]) => {
    const r = el('div', 'display: flex; align-items: center; gap: 8px;');
    r.appendChild(el('span', 'width: 14px; height: 6px; border-radius: 3px; flex: 0 0 auto; background: ' + h.colors[sev] + ';'));
    r.appendChild(el('span', 'font-size: 11.5px; font-weight: 300; color: #454949; white-space: nowrap;', label));
    lg.appendChild(r);
  });

  const feats = visibleFeatures();

  const st = document.getElementById('stats');
  st.innerHTML = '';
  statsFor(state.city, state.hazard, feats).forEach(([label, value, unit]) => {
    const c = el('div', 'min-width: 0; background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 2px 16px rgba(0,0,0,.05); display: flex; flex-direction: column; gap: 12px;');
    c.appendChild(el('span', 'font-size: 12.5px; font-weight: 300; color: #6B7070; line-height: 1.4;', label));
    const v = el('div', 'display: flex; align-items: baseline; gap: 5px;');
    const num = el('span', 'font-size: 27px; font-weight: 300; letter-spacing: -.03em;', value);
    num.className = 'mono';
    const u = el('span', 'font-size: 11px; color: #6B7070;', unit);
    u.className = 'mono';
    v.appendChild(num); v.appendChild(u);
    c.appendChild(v);
    st.appendChild(c);
  });

  const list = document.getElementById('list');
  list.innerHTML = '';
  feats.forEach(f => {
    const r = el('div');
    r.className = 'row' + (state.focus === f.name ? ' on' : '');
    r.tabIndex = 0;
    r.appendChild(el('span', 'width: 10px; height: 34px; border-radius: 5px; flex: 0 0 auto; background: ' + h.colors[f.sev] + ';'));
    const mid = el('div', 'min-width: 0; display: flex; flex-direction: column; gap: 3px; flex: 1;');
    mid.appendChild(el('span', 'font-size: 13.5px; font-weight: 400;', f.name));
    const meta = el('span', 'font-size: 11px; color: #6B7070;', f.area + ' · ' + f.metric);
    meta.className = 'mono';
    mid.appendChild(meta);
    r.appendChild(mid);
    const kind = el('span', 'font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6B7070; white-space: nowrap;',
      f.kind === 'line' ? 'Street' : f.kind === 'zone' ? 'Area' : 'Asset');
    kind.className = 'mono';
    r.appendChild(kind);
    const go = () => {
      state.focus = f.name;
      if (f.kind === 'point') map.setView(f.coords, 15);
      else map.fitBounds(L.latLngBounds(f.coords).pad(0.6));
      render();
    };
    r.addEventListener('click', go);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    list.appendChild(r);
  });

  document.getElementById('listCount').textContent = feats.length + ' of ' + CITIES[state.city].places.length;
  document.getElementById('shownCount').textContent = feats.length + ' features shown';

  drawMap();
}

render();

// the map box is sized by aspect-ratio inside a flex column, so wait for a real size
let sized = false;
new ResizeObserver(entries => {
  const r = entries[0].contentRect;
  if (r.width > 0 && r.height > 0) {
    map.invalidateSize();
    if (!sized) { sized = true; map.setView(CITIES[state.city].center, CITIES[state.city].zoom); }
  }
}).observe(document.getElementById('map'));
</script>
</body>
</html>
